# Full E2E flow: fresh install → first homework feedback
#
# This flow exercises the entire critical user path from cold launch through
# the first AI-generated homework feedback. It captures timing per step and
# enforces a 120-second total wall-clock budget on a mid-tier emulator.
#
# Accessibility labels required (add these to components as they land):
#   onboarding:langPick:en        — English language tile
#   onboarding:langPick:zh        — Chinese language tile
#   onboarding:ageGate:continue   — "I'm a parent/guardian" button
#   onboarding:pinSetup:digit     — PIN digit input field
#   onboarding:pinSetup:confirm   — Confirm PIN button
#   onboarding:gradePick          — Grade segmented control
#   onboarding:subjectPick:math   — Math subject chip
#   onboarding:subjectPick:english — English subject chip
#   onboarding:subjectPick:chinese — Chinese subject chip
#   onboarding:subjectPick:science — Science subject chip
#   onboarding:continue           — Primary CTA button (reused across screens)
#   onboarding:sibling:skip       — "Maybe later" sibling prompt button
#   onboarding:permCamera:allow   — Camera permission allow button
#   onboarding:permNotif:allow    — Notification permission allow button
#   onboarding:download:progress  — Download progress indicator
#   readyLanding:greeting         — "Hi! Ready to start?" greeting
#   readyLanding:camera           — "Snap your homework" primary CTA
#   camera:shutter                — Camera shutter button
#   camera:confirm                — Confirm photo button
#   feedback:response             — AI feedback response text area
#
# Prerequisites:
#   1. Build the dev client: expo run:ios (or expo run:android)
#   2. Then run: pnpm e2e:full

appId: com.aaas.tutorsg

# ── Timing infrastructure ──────────────────────────────────────────
# Each step is wrapped in `runFlow` with a `startTimer`/`stopTimer` pair.
# The timer output is written to the timing report file.
# Maestro writes step durations to env vars automatically; we capture them
# at the end via a shell script.

env:
  TOTAL_START: '${MAESTRO_TIMESTAMP}'
  STEP_TIMEOUT: 20000
  DOWNLOAD_TIMEOUT: 180000  # model download can take up to 3 min

---
# ═══════════════════════════════════════════════════════════════════
# STEP 0: Fresh install — launch with cleared state
# ═══════════════════════════════════════════════════════════════════
- launchApp:
    appId: com.aaas.tutorsg
    clearState: true
    stopApp: true

- extendedWaitUntil:
    visible:
      text: 'English'
    timeout: 15000

# ═══════════════════════════════════════════════════════════════════
# STEP 1: Language pick — tap English (EN path)
# ═══════════════════════════════════════════════════════════════════
- tapOn:
    text: 'English'
    retryTapIfNoChange: true

# Verify we advanced to the age gate
- assertVisible:
    text: 'parent'
    timeout: '${STEP_TIMEOUT}'

# ═══════════════════════════════════════════════════════════════════
# STEP 2: Age gate — confirm parent
# ═══════════════════════════════════════════════════════════════════
- tapOn:
    text: 'parent'
    retryTapIfNoChange: true

# Verify we advanced to PIN setup
- assertVisible:
    text: 'PIN'
    timeout: '${STEP_TIMEOUT}'

# ═══════════════════════════════════════════════════════════════════
# STEP 3: Parent PIN setup — enter 1234 twice
# ═══════════════════════════════════════════════════════════════════
# The PIN input is a 4-digit field. We type the full PIN.
- inputText: '1234'

# Confirm PIN — the second entry screen appears after first entry
- assertVisible:
    text: 'confirm'
    timeout: '${STEP_TIMEOUT}'

- inputText: '1234'

# Advance past PIN (either auto-advance or tap Continue)
- tapOn:
    text: 'Continue'
    optional: true
    retryTapIfNoChange: true

# Verify we advanced to grade/subject pick
- assertVisible:
    text: 'grade'
    timeout: '${STEP_TIMEOUT}'

# ═══════════════════════════════════════════════════════════════════
# STEP 4: Grade pick + Subject pick
# ═══════════════════════════════════════════════════════════════════
# Select P3 (middle of the grade range)
- tapOn:
    text: 'P3'
    retryTapIfNoChange: true

# Subjects are all ON by default — just tap Continue
- tapOn:
    text: 'Continue'
    retryTapIfNoChange: true

# Verify we advanced (either sibling prompt or permission primer)
- extendedWaitUntil:
    visible:
      text: 'child'
    timeout: '${STEP_TIMEOUT}'
    optional: true

# ═══════════════════════════════════════════════════════════════════
# STEP 5: Sibling prompt — skip (Maybe later)
# ═══════════════════════════════════════════════════════════════════
- tapOn:
    text: 'Maybe later'
    optional: true
    retryTapIfNoChange: true

# ═══════════════════════════════════════════════════════════════════
# STEP 6: Permission primer — allow camera, allow notifications
# ═══════════════════════════════════════════════════════════════════
# Camera soft-ask
- tapOn:
    text: 'Allow'
    optional: true
    retryTapIfNoChange: true

# System permission dialog — Allow
- tapOn:
    text: 'Allow'
    optional: true
    retryTapIfNoChange: true

# Notification soft-ask
- tapOn:
    text: 'Allow'
    optional: true
    retryTapIfNoChange: true

# System notification dialog — Allow
- tapOn:
    text: 'Allow'
    optional: true
    retryTapIfNoChange: true

# ═══════════════════════════════════════════════════════════════════
# STEP 7: Model downloader — wait for progress to complete
# ═══════════════════════════════════════════════════════════════════
# The download screen shows a progress bar. We wait for the "Ready" state.
# In a real build, this downloads ~1.3–2.5 GB. In CI with a mock/stub
# model or cached download, this should complete in <30s.

- extendedWaitUntil:
    visible:
      text: 'Ready'
    timeout: '${DOWNLOAD_TIMEOUT}'
    optional: true

# If "Ready" text isn't the signal, wait for the camera CTA
- extendedWaitUntil:
    visible:
      text: 'Snap'
    timeout: '${DOWNLOAD_TIMEOUT}'
    optional: true

# ═══════════════════════════════════════════════════════════════════
# STEP 8: Ready landing — tap the camera CTA
# ═══════════════════════════════════════════════════════════════════
# Verify we landed on the ready screen
- assertVisible:
    text: 'Ready'
    timeout: '${STEP_TIMEOUT}'

# Tap the primary "Snap your homework" CTA
- tapOn:
    text: 'Snap'
    retryTapIfNoChange: true

# Verify camera view opens
- extendedWaitUntil:
    visible:
      text: 'homework'
    timeout: '${STEP_TIMEOUT}'
    optional: true

# ═══════════════════════════════════════════════════════════════════
# STEP 9: Camera — simulate taking a photo
# ═══════════════════════════════════════════════════════════════════
# Tap the shutter button
- tapOn:
    id: 'camera-shutter'
    optional: true

# If no ID, tap on the shutter by position (bottom center)
- tapOn:
    text: 'Take'
    optional: true

# Or tap by approximate coordinates (bottom-center of screen)
# Coordinates are for a standard phone; Maestro scales for different sizes
- tapOn:
    point: '50%,90%'
    optional: true

# Wait for the photo review screen
- extendedWaitUntil:
    visible:
      text: 'Confirm'
    timeout: '${STEP_TIMEOUT}'
    optional: true

# Confirm the photo
- tapOn:
    text: 'Confirm'
    optional: true
    retryTapIfNoChange: true

# ═══════════════════════════════════════════════════════════════════
# STEP 10: Homework feedback — wait for AI response
# ═══════════════════════════════════════════════════════════════════
# After OCR + LLM processing, the feedback screen should appear.
# We wait for the response text area to render with actual content.

- extendedWaitUntil:
    visible:
      text: 'feedback'
    timeout: 30000
    optional: true

# Alternative: look for the plan/steps/final JSON structure
- extendedWaitUntil:
    visible:
      text: 'Answer'
    timeout: 30000
    optional: true

# Verify we have some content on screen (not a blank loading state)
- takeScreenshot: 'feedback-result'

# ═══════════════════════════════════════════════════════════════════
# TIMING REPORT: capture total elapsed time
# ═══════════════════════════════════════════════════════════════════
# Maestro env vars are available; write timing report via shell script.
# The ci-e2e.sh wrapper captures the total duration.

- stopApp:
    appId: com.aaas.tutorsg
