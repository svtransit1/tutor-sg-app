# Maestro E2E: Camera capture — single photo, preview, retake, confirm
#
# Tests the camera screen flow:
#   1. Ready — "Open Scanner" or "Open Camera" button
#   2. Preview — captured photo shown with Retake / Use This Photo buttons
#   3. Processing — spinner appears, then navigates to feedback or manual-input
#
# Also verifies photo sandbox behavior:
#   - Photo saved to app cache only (never camera roll)
#   - Confirm navigates away (cleanup fires on unmount)
#
# Prerequisites:
#   1. Build the dev client: expo run:ios (or expo run:android)
#   2. Run: maestro test .maestro/flows/camera-capture.yaml
#
# Note: When running on a simulator/emulator without the native
# document scanner, the app falls back to the expo-camera viewfinder.
# This flow handles both paths via optional tapOn at branch points.

appId: com.aaas.tutorsg
env:
  STEP_TIMEOUT: 15000

---
# ═══════════════════════════════════════════════════════════════════
# SETUP: Quick onboarding to reach home screen
# ═══════════════════════════════════════════════════════════════════

- launchApp:
    appId: com.aaas.tutorsg
    clearState: true
    stopApp: true

# Speed through onboarding — accept defaults to reach home
- extendedWaitUntil:
    visible:
      text: 'Welcome'
    timeout: '${STEP_TIMEOUT}'
- tapOn:
    id: 'welcome-continue'
    optional: true

- extendedWaitUntil:
    visible:
      text: 'Privacy'
    timeout: '${STEP_TIMEOUT}'
    optional: true
- tapOn:
    id: 'consent-checkbox'
    optional: true
- tapOn:
    id: 'consent-continue'
    optional: true

- extendedWaitUntil:
    visible:
      text: 'Ready'
    timeout: 30000
    optional: true
- tapOn:
    id: 'deviceTier-continue'
    optional: true

- extendedWaitUntil:
    visible:
      text: 'child'
    timeout: '${STEP_TIMEOUT}'
    optional: true
- tapOn:
    id: 'kidProfile-add'
    optional: true
- tapOn:
    id: 'kidProfile-name'
    optional: true
- inputText: 'TestKid'
    optional: true
- tapOn:
    id: 'kidProfile-level-P3'
    optional: true
- tapOn:
    id: 'kidProfile-save'
    optional: true

- extendedWaitUntil:
    visible:
      text: 'Ready to start'
    timeout: 15000

# ═══════════════════════════════════════════════════════════════════
# STEP 1: Tap "Snap your homework" to open the camera/scan screen
# ═══════════════════════════════════════════════════════════════════
- assertVisible:
    text: 'Snap your homework'
- tapOn:
    text: 'Snap your homework'

# Verify we landed on the camera screen
# (either the "ready" screen with scan button, or the viewfinder)
- extendedWaitUntil:
    visible:
      text: 'Scan'
    timeout: '${STEP_TIMEOUT}'
    optional: true

# ═══════════════════════════════════════════════════════════════════
# STEP 2: Start scanning — tap the "Open Scanner" / "Open Camera" button
# ═══════════════════════════════════════════════════════════════════

# On devices with native document scanner, this opens the scanner UI
# On simulator/emulator without scanner, this opens the expo-camera viewfinder
- tapOn:
    text: 'Open'
    optional: true

# ═══════════════════════════════════════════════════════════════════
# STEP 3: Viewfinder — verify camera UI elements
# ═══════════════════════════════════════════════════════════════════
# (Only visible when using expo-camera fallback path)
- extendedWaitUntil:
    visible:
      text: 'worksheet'
    timeout: '${STEP_TIMEOUT}'
    optional: true

# Back button visible
- assertVisible:
    text: 'Back'
    optional: true

# Capture button — tap at bottom center to take a photo
- tapOn:
    point: '50%,90%'
    optional: true

# ═══════════════════════════════════════════════════════════════════
# STEP 4: Preview — photo taken, review screen
# ═══════════════════════════════════════════════════════════════════

# The preview state should show "Review your photo" text
- extendedWaitUntil:
    visible:
      text: 'Review your photo'
    timeout: '${STEP_TIMEOUT}'

# "Use This Photo" button must be visible (non-optional)
- assertVisible:
    text: 'Use This Photo'

# "Retake" button must be visible (non-optional)
- assertVisible:
    text: 'Retake'

# ═══════════════════════════════════════════════════════════════════
# STEP 5: Retake — discard photo, return to viewfinder
# ═══════════════════════════════════════════════════════════════════
- tapOn:
    text: 'Retake'

# Should return to the viewfinder or ready screen
- extendedWaitUntil:
    visible:
      text: 'Scan'
    timeout: '${STEP_TIMEOUT}'

# ═══════════════════════════════════════════════════════════════════
# STEP 6: Capture again, then confirm
# ═══════════════════════════════════════════════════════════════════

# Tap the "Open Scanner"/"Open Camera" button again
- tapOn:
    text: 'Open'
    optional: true

# If we're in the expo-camera viewfinder, take a photo
- extendedWaitUntil:
    visible:
      text: 'worksheet'
    timeout: '${STEP_TIMEOUT}'
    optional: true
- tapOn:
    point: '50%,90%'
    optional: true

# Wait for the preview to load (non-optional)
- extendedWaitUntil:
    visible:
      text: 'Review your photo'
    timeout: '${STEP_TIMEOUT}'

# Confirm the photo — tap "Use This Photo" (non-optional, critical path)
- tapOn:
    text: 'Use This Photo'

# ═══════════════════════════════════════════════════════════════════
# STEP 7: Processing state
# ═══════════════════════════════════════════════════════════════════

# After confirming, we should see the processing spinner
- extendedWaitUntil:
    visible:
      text: 'Processing...'
    timeout: '${STEP_TIMEOUT}'

# ═══════════════════════════════════════════════════════════════════
# STEP 8: Result — feedback or manual-input screen
# ═══════════════════════════════════════════════════════════════════

# The OCR mock routes to feedback or manual-input depending on confidence
# Both are acceptable outcomes
- extendedWaitUntil:
    visible:
      text: 'Type'
    timeout: 30000
    optional: true

- extendedWaitUntil:
    visible:
      text: 'Homework Feedback'
    timeout: 30000
    optional: true

# ═══════════════════════════════════════════════════════════════════
# CLEANUP
# ═══════════════════════════════════════════════════════════════════
- stopApp:
    appId: com.aaas.tutorsg
