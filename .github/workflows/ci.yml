name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch (not on main though)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  lockfile-guard:
    name: Lockfile guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check lockfile is pristine
        run: |
          if ! git diff --exit-code pnpm-lock.yaml; then
            echo "❌ pnpm-lock.yaml has uncommitted changes after pnpm install."
            echo "Run 'pnpm install' from repo root and commit the updated lockfile."
            exit 1
          fi
          echo "✅ pnpm-lock.yaml is pristine."

  typecheck:
    name: Typecheck
    needs: [lockfile-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    needs: [lockfile-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  bundle:
    name: RN Bundle
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Expo export ${{ matrix.platform }}
        run: npx expo export --platform ${{ matrix.platform }} --output-dir dist-${{ matrix.platform }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  # ── E2E Maestro: Android emulator ───────────────────────────────
  e2e-android:
    name: E2E Maestro (Android)
    needs: [bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # Install Maestro CLI
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # Set up Android emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          script: |
            # The emulator is running at this point.
            # Install workspace deps from root, then build the Expo dev client APK
            pnpm install --frozen-lockfile
            cd mobile
            npx expo run:android --no-install --variant release
            cd ..

            # Run the full E2E flow with timing capture
            chmod +x scripts/ci-e2e.sh
            ./scripts/ci-e2e.sh android onboarding-to-feedback.yaml || true

      # Upload timing report as CI artifact
      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timing-android
          path: |
            e2e-timing-report-android.json
            maestro-run-android.log
          retention-days: 30

      # Fail the job if the timing budget was exceeded
      - name: Check timing budget
        run: |
          if [ -f e2e-timing-report-android.json ]; then
            STATUS=$(jq -r '.status' e2e-timing-report-android.json)
            if [ "$STATUS" != "passed" ]; then
              echo "E2E failed: $(jq -r '.failure_reason' e2e-timing-report-android.json)"
              exit 1
            fi
          else
            echo "Timing report not found — E2E did not complete"
            exit 1
          fi

  # ── E2E Maestro: iOS simulator ──────────────────────────────────
  e2e-ios:
    name: E2E Maestro (iOS)
    needs: [bundle]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # Install Maestro CLI
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # Build iOS dev client and run E2E
      - name: Build & run E2E
        run: |
          # Install workspace deps from root
          pnpm install --frozen-lockfile

          # Install CocoaPods deps
          cd mobile/ios
          pod install --repo-update
          cd ../..

          # Build the dev client for the simulator
          cd mobile
          npx expo run:ios --no-install --scheme tutor-sg
          cd ..

          # Run the full E2E flow with timing capture
          chmod +x scripts/ci-e2e.sh
          ./scripts/ci-e2e.sh ios onboarding-to-feedback.yaml || true

      # Upload timing report as CI artifact
      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timing-ios
          path: |
            e2e-timing-report-ios.json
            maestro-run-ios.log
          retention-days: 30

      # Fail the job if the timing budget was exceeded
      - name: Check timing budget
        run: |
          if [ -f e2e-timing-report-ios.json ]; then
            STATUS=$(jq -r '.status' e2e-timing-report-ios.json)
            if [ "$STATUS" != "passed" ]; then
              echo "E2E failed: $(jq -r '.failure_reason' e2e-timing-report-ios.json)"
              exit 1
            fi
          else
            echo "Timing report not found — E2E did not complete"
            exit 1
          fi
